name: Generate Prisma baseline artifact

on:
  push:
    branches:
      - fix/lifecycle-concurrency-migrations
  pull_request:
    branches:
      - feat/booking-lifecycle-hardening

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate baseline migration SQL
        run: |
          mkdir -p roguerpm-db/prisma/migrations/20261126000000_initial
          npx prisma migrate diff --from-empty --to-schema-datamodel roguerpm-db/prisma/schema.prisma --script > roguerpm-db/prisma/migrations/20261126000000_initial/migration.sql
          printf '\n-- Additional PostgreSQL integrity constraints\n' >> roguerpm-db/prisma/migrations/20261126000000_initial/migration.sql
          cat roguerpm-db/prisma/sql/postgres_integrity_constraints.sql >> roguerpm-db/prisma/migrations/20261126000000_initial/migration.sql
          printf 'provider = "postgresql"\n' > roguerpm-db/prisma/migrations/migration_lock.toml
          test -s roguerpm-db/prisma/migrations/20261126000000_initial/migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-baseline-migration
          path: roguerpm-db/prisma/migrations/
          if-no-files-found: error
