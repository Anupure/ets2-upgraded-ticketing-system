name: Booking service CI

on:
  push:
    branches:
      - master
      - feat/booking-lifecycle-hardening
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ets2_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema roguerpm-db/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema roguerpm-db/prisma/schema.prisma

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
